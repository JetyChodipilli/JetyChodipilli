<svg width="1200" height="390" viewBox="0 0 1200 390" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390">
    <stop stop-color="#F7FBFD"/>
    <stop offset=".55" stop-color="#EEF7FA"/>
    <stop offset="1" stop-color="#E8F3F1"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#155EEF"/>
    <stop offset="1" stop-color="#0F9F8F"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324F" flood-opacity=".10"/>
  </filter>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:8 10;animation:dash 8s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .blink{animation:blink 1.2s steps(2,end) infinite}
    @keyframes dash{to{stroke-dashoffset:-180}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:.2}}
  </style>
</defs>

<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
