<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760">
    <stop stop-color="#F8FBFD"/>
    <stop offset=".5" stop-color="#EEF7FA"/>
    <stop offset="1" stop-color="#E8F3F1"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15324B" flood-opacity=".10"/>
  </filter>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:12 13;animation:dash 5.5s linear infinite}
    .flow2{stroke-dasharray:7 10;animation:dash2 3.8s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .pulse2{animation:pulse 2.4s ease-in-out .8s infinite}
    @keyframes dash{to{stroke-dashoffset:-250}}
    @keyframes dash2{to{stroke-dashoffset:-180}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  </style>
</defs>

<rect width="1600" height="760" rx="28" fill="url(#bg)"/>
<g opacity=".22" stroke="#76A7BE" stroke-width="1">
  <path d="M0 76H1600M0 152H1600M0 228H1600M0 304H1600M0 380H1600M0 456H1600M0 532H1600M0 608H1600M0 684H1600"/>
  <path d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760M1200 0V760M1300 0V760M1400 0V760M1500 0V760"/>
</g>

<text x="52" y="54" class="sans" font-size="28" font-weight="700" fill="#15324B">Java Backend Architecture Approach</text>
<text x="52" y="80" class="mono" font-size="13" letter-spacing="2" fill="#587184">REQUEST FLOW • SECURITY • DOMAIN SERVICES • EVENTS • DATA • DELIVERY</text>

<!-- stage headers -->
<g class="mono" font-size="12" letter-spacing="2" fill="#5A7182">
  <text x="66" y="132">01 / INGRESS</text>
  <text x="355" y="132">02 / SECURITY</text>
  <text x="670" y="132">03 / DOMAIN</text>
  <text x="1070" y="132">04 / EVENT & DATA PLANE</text>
</g>

<!-- ingress card -->
<g filter="url(#shadow)">
  <rect x="52" y="154" width="250" height="206" rx="18" fill="#FFFFFF" fill-opacity=".9" stroke="#BAD5E1"/>
  <text x="74" y="187" class="sans" font-size="18" font-weight="700" fill="#15324B">External Requests</text>
  <rect x="78" y="216" width="200" height="54" rx="12" fill="#F6FAFC" stroke="#98BED0"/>
  <text x="116" y="240" class="sans" font-size="14" font-weight="700" fill="#173F5F">Web / Mobile Client</text>
  <text x="118" y="258" class="mono" font-size="10" fill="#637A89">HTTPS / REST</text>
  <rect x="78" y="289" width="200" height="50" rx="12" fill="#F6FAFC" stroke="#98BED0"/>
  <text x="116" y="319" class="sans" font-size="14" font-weight="700" fill="#173F5F">API Gateway / Edge</text>
</g>

<!-- security -->
<g filter="url(#shadow)">
  <rect x="338" y="154" width="278" height="206" rx="18" fill="#FFFFFF" fill-opacity=".9" stroke="#BAD5E1"/>
  <text x="360" y="187" class="sans" font-size="18" font-weight="700" fill="#15324B">Security Chain</text>
  <rect x="364" y="214" width="226" height="54" rx="12" fill="#EEF9F6" stroke="#78BCAF"/>
  <text x="392" y="239" class="sans" font-size="14" font-weight="700" fill="#173F5F">Spring Security Filters</text>
  <text x="407" y="257" class="mono" font-size="10" fill="#637A89">authn / authz</text>
  <rect x="364" y="284" width="106" height="52" rx="12" fill="#F6FAFC" stroke="#98BED0"/>
  <text x="389" y="307" class="sans" font-size="13" font-weight="700" fill="#173F5F">JWT / OAuth2</text>
  <text x="395" y="325" class="mono" font-size="9.5" fill="#637A89">identity</text>
  <rect x="484" y="284" width="106" height="52" rx="12" fill="#F6FAFC" stroke="#98BED0"/>
  <text x="517" y="307" class="sans" font-size="13" font-weight="700" fill="#173F5F">RBAC</text>
  <text x="501" y="325" class="mono" font-size="9.5" fill="#637A89">permissions</text>
</g>

<!-- domain -->
<g filter="url(#shadow)">
  <rect x="650" y="154" width="372" height="354" rx="18" fill="#FFFFFF" fill-opacity=".92" stroke="#BAD5E1"/>
  <text x="674" y="187" class="sans" font-size="18" font-weight="700" fill="#15324B">Spring Boot Domain Services</text>
  <text x="674" y="208" class="mono" font-size="10.5" fill="#637A89">controllers → services → repositories</text>

  <rect x="678" y="232" width="150" height="54" rx="12" fill="#F1F6FF" stroke="#8EAFE0"/>
  <text x="706" y="255" class="sans" font-size="13" font-weight="700" fill="#173F5F">Visitor Management</text>
  <text x="717" y="274" class="mono" font-size="9.5" fill="#637A89">workflow / QR pass</text>

  <rect x="844" y="232" width="150" height="54" rx="12" fill="#F1F6FF" stroke="#8EAFE0"/>
  <text x="870" y="255" class="sans" font-size="13" font-weight="700" fill="#173F5F">Employee / HR</text>
  <text x="877" y="274" class="mono" font-size="9.5" fill="#637A89">tasks / approvals</text>

  <rect x="678" y="302" width="150" height="54" rx="12" fill="#F1F6FF" stroke="#8EAFE0"/>
  <text x="700" y="325" class="sans" font-size="13" font-weight="700" fill="#173F5F">Notifications</text>
  <text x="702" y="344" class="mono" font-size="9.5" fill="#637A89">internal calls / events</text>

  <rect x="844" y="302" width="150" height="54" rx="12" fill="#F1F6FF" stroke="#8EAFE0"/>
  <text x="875" y="325" class="sans" font-size="13" font-weight="700" fill="#173F5F">Reporting / Audit</text>
  <text x="879" y="344" class="mono" font-size="9.5" fill="#637A89">history / evidence</text>

  <rect x="678" y="390" width="316" height="86" rx="13" fill="#F7FBFD" stroke="#A9C9D7"/>
  <text x="700" y="416" class="mono" font-size="11" fill="#52687A">APPLICATION LAYER</text>
  <text x="700" y="441" class="sans" font-size="13" font-weight="700" fill="#173F5F">Spring Data JPA / Hibernate</text>
  <text x="700" y="462" class="mono" font-size="10" fill="#637A89">transaction boundaries • repositories • ORM</text>
</g>

<!-- right plane -->
<g filter="url(#shadow)">
  <rect x="1056" y="154" width="492" height="354" rx="18" fill="#FFFFFF" fill-opacity=".92" stroke="#BAD5E1"/>
  <text x="1080" y="187" class="sans" font-size="18" font-weight="700" fill="#15324B">Event & Data Plane</text>

  <rect x="1080" y="222" width="136" height="72" rx="13" fill="#FFF7F1" stroke="#E3B087"/>
  <text x="1100" y="249" class="sans" font-size="14" font-weight="700" fill="#173F5F">Kafka Producer</text>
  <text x="1112" y="271" class="mono" font-size="10" fill="#637A89">publish events</text>

  <rect x="1240" y="222" width="136" height="72" rx="13" fill="#FFF7F1" stroke="#E3B087"/>
  <text x="1274" y="249" class="sans" font-size="14" font-weight="700" fill="#173F5F">Kafka Topics</text>
  <text x="1270" y="271" class="mono" font-size="10" fill="#637A89">event stream</text>

  <rect x="1400" y="222" width="124" height="72" rx="13" fill="#FFF7F1" stroke="#E3B087"/>
  <text x="1422" y="249" class="sans" font-size="14" font-weight="700" fill="#173F5F">Consumers</text>
  <text x="1418" y="271" class="mono" font-size="10" fill="#637A89">async workers</text>

  <rect x="1080" y="338" width="136" height="72" rx="13" fill="#FFF3F0" stroke="#E3A198"/>
  <text x="1126" y="365" class="sans" font-size="14" font-weight="700" fill="#173F5F">Redis</text>
  <text x="1098" y="387" class="mono" font-size="10" fill="#637A89">cache / session</text>

  <rect x="1240" y="338" width="136" height="72" rx="13" fill="#F1F5FF" stroke="#8FAEE0"/>
  <text x="1266" y="365" class="sans" font-size="14" font-weight="700" fill="#173F5F">PostgreSQL</text>
  <text x="1267" y="387" class="mono" font-size="10" fill="#637A89">source of truth</text>

  <rect x="1400" y="338" width="124" height="72" rx="13" fill="#F6F3FF" stroke="#AC9ADE"/>
  <text x="1439" y="365" class="sans" font-size="14" font-weight="700" fill="#173F5F">Flyway</text>
  <text x="1417" y="387" class="mono" font-size="10" fill="#637A89">DB migrations</text>

  <rect x="1080" y="436" width="444" height="48" rx="12" fill="#ECF5F8"/>
  <text x="1101" y="465" class="mono" font-size="10.5" fill="#456276">REST / gRPC FOR SYNC CALLS  •  KAFKA FOR ASYNC WORKFLOWS</text>
</g>

<!-- primary request flow -->
<path d="M302 256H338" stroke="#155EEF" stroke-width="4"/>
<path d="M616 256H650" stroke="#155EEF" stroke-width="4"/>
<path d="M1022 256H1056" stroke="#155EEF" stroke-width="4"/>
<circle cx="320" cy="256" r="6" fill="#155EEF" class="pulse"/>
<circle cx="634" cy="256" r="6" fill="#155EEF" class="pulse2"/>
<circle cx="1038" cy="256" r="6" fill="#155EEF" class="pulse"/>

<!-- event flow -->
<path d="M994 330C1030 330 1046 258 1080 258" fill="none" stroke="#D49A4A" stroke-width="3" class="flow2"/>
<path d="M1216 258H1240M1376 258H1400" stroke="#D49A4A" stroke-width="3" class="flow2"/>

<!-- data flow -->
<path d="M994 430C1050 430 1042 374 1080 374M994 430C1130 430 1170 374 1240 374M1376 374H1400" fill="none" stroke="#0F9F8F" stroke-width="3" class="flow"/>
<circle cx="1060" cy="406" r="6" fill="#0F9F8F" class="pulse"/>
<circle cx="1200" cy="389" r="6" fill="#0F9F8F" class="pulse2"/>

<!-- delivery lane -->
<g filter="url(#shadow)">
  <rect x="52" y="552" width="1496" height="152" rx="20" fill="#FFFFFF" fill-opacity=".9" stroke="#BAD5E1"/>
  <text x="78" y="586" class="sans" font-size="18" font-weight="700" fill="#15324B">Delivery Pipeline</text>
  <text x="78" y="608" class="mono" font-size="11" fill="#637A89">commit → verify → package → containerize → deploy</text>

  <g class="mono" font-size="12" fill="#26475C">
    <rect x="90" y="634" width="130" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="119" y="660">GIT COMMIT</text>
    <rect x="276" y="634" width="150" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="304" y="660">MAVEN BUILD</text>
    <rect x="484" y="634" width="170" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="509" y="660">JUNIT / MOCKITO</text>
    <rect x="712" y="634" width="130" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="750" y="660">DOCKER</text>
    <rect x="900" y="634" width="190" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="925" y="660">GITHUB ACTIONS</text>
    <rect x="1148" y="634" width="220" height="42" rx="11" fill="#F7FBFD" stroke="#A8C8D6"/><text x="1185" y="660">AWS EC2 / RDS / SES</text>
  </g>
  <path d="M220 655H276M426 655H484M654 655H712M842 655H900M1090 655H1148" stroke="#155EEF" stroke-width="3" class="flow2"/>
</g>

<!-- status labels -->
<g class="mono" font-size="11">
  <text x="1380" y="86" fill="#0F9F8F">● AUTH READY</text>
  <text x="1470" y="86" fill="#155EEF">● DB UP</text>
</g>
</svg>