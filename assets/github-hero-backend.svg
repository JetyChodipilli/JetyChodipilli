<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620">
    <stop stop-color="#F8FBFD"/>
    <stop offset=".52" stop-color="#EEF7FA"/>
    <stop offset="1" stop-color="#E6F2F0"/>
  </linearGradient>
  <linearGradient id="name" x1="70" y1="0" x2="620" y2="0">
    <stop stop-color="#102A43"/>
    <stop offset=".5" stop-color="#155EEF"/>
    <stop offset="1" stop-color="#0F9F8F"/>
  </linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#15324B" flood-opacity=".10"/>
  </filter>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:10 12;animation:dash 6s linear infinite}
    .pulse{animation:pulse 2.3s ease-in-out infinite}
    .pulse2{animation:pulse 2.3s ease-in-out .7s infinite}
    .scan{animation:scan 5.5s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-220}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{0%,100%{transform:translateX(0);opacity:.2}50%{transform:translateX(70px);opacity:.8}}
  </style>
</defs>

<rect width="1600" height="620" rx="30" fill="url(#bg)"/>
<g opacity=".22" stroke="#76A7BE" stroke-width="1">
  <path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600M0 420H1600M0 490H1600M0 560H1600"/>
  <path d="M100 0V620M200 0V620M300 0V620M400 0V620M500 0V620M600 0V620M700 0V620M800 0V620M900 0V620M1000 0V620M1100 0V620M1200 0V620M1300 0V620M1400 0V620M1500 0V620"/>
</g>

<!-- top rail -->
<g class="mono" font-size="16" fill="#47677A">
  <text x="70" y="48" letter-spacing="4">CODE  •  BUILD  •  SECURE  •  DEPLOY  •  SCALE</text>
  <text x="1280" y="48" letter-spacing="2">BACKEND / SYSTEMS</text>
</g>
<path d="M70 65H1530" stroke="#A8CAD8"/>

<!-- identity -->
<text x="70" y="118" class="sans" font-size="28" fill="#587184">Hi there, I’m</text>
<text x="68" y="205" class="sans" font-size="74" font-weight="800" fill="url(#name)">Jety Chodipilli</text>
<text x="72" y="253" class="sans" font-size="33" font-weight="700" fill="#15324B">Java Backend Developer</text>
<text x="72" y="291" class="sans" font-size="20" fill="#52687A">Secure APIs • Microservices • Event-Driven Systems • Cloud</text>

<!-- chips -->
<g class="mono" font-size="14" fill="#26475C">
  <g><rect x="70" y="322" width="112" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="93" y="346">JAVA 17/21</text></g>
  <g><rect x="192" y="322" width="130" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="215" y="346">SPRING BOOT</text></g>
  <g><rect x="332" y="322" width="154" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="351" y="346">SPRING SECURITY</text></g>
  <g><rect x="70" y="370" width="124" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="91" y="394">POSTGRESQL</text></g>
  <g><rect x="204" y="370" width="82" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="226" y="394">KAFKA</text></g>
  <g><rect x="296" y="370" width="78" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="316" y="394">REDIS</text></g>
  <g><rect x="384" y="370" width="86" height="38" rx="11" fill="#FFF" stroke="#BDD4DF"/><text x="402" y="394">DOCKER</text></g>
</g>

<!-- terminal -->
<g filter="url(#cardShadow)">
  <rect x="70" y="445" width="430" height="118" rx="18" fill="#0E2B40"/>
  <circle cx="94" cy="466" r="5" fill="#E06C75"/><circle cx="112" cy="466" r="5" fill="#E5C07B"/><circle cx="130" cy="466" r="5" fill="#98C379"/>
  <text x="92" y="495" class="mono" font-size="14" fill="#7FD1C8">backend@jety:~$ ./run-system</text>
  <text x="92" y="520" class="mono" font-size="13" fill="#DCEAF0">Security chain ready  •  DB migrations clean</text>
  <text x="92" y="543" class="mono" font-size="13" fill="#DCEAF0">Kafka consumers online  •  service health: UP</text>
  <rect x="92" y="551" width="10" height="13" rx="2" fill="#7FD1C8" class="pulse"/>
</g>

<!-- main engineering board -->
<g filter="url(#cardShadow)">
  <rect x="545" y="92" width="745" height="420" rx="24" fill="#FFFFFF" fill-opacity=".90" stroke="#B9D5E1"/>
  <text x="574" y="127" class="sans" font-size="24" font-weight="700" fill="#15324B">Backend Control Plane</text>
  <text x="1030" y="126" class="mono" font-size="12" fill="#0F9F8F">LIVE • SECURE • EVENT-DRIVEN</text>

  <!-- ingress -->
  <rect x="578" y="170" width="120" height="72" rx="14" fill="#F7FBFD" stroke="#93BDD1"/>
  <text x="616" y="197" class="sans" font-size="14" font-weight="700" fill="#15324B">Client</text>
  <text x="600" y="220" class="mono" font-size="11" fill="#637A89">REST / HTTP</text>

  <rect x="748" y="170" width="132" height="72" rx="14" fill="#F7FBFD" stroke="#93BDD1"/>
  <text x="772" y="197" class="sans" font-size="14" font-weight="700" fill="#15324B">API Gateway</text>
