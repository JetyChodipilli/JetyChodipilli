  <text x="1110" y="380" class="mono" font-size="11" fill="#637A89">schema versioning</text>

  <path d="M1187 270V292H655V330M1187 292H822V330M1187 292H985V330M1187 292H1158V330" fill="none" stroke="#0F9F8F" stroke-width="2.5" class="flow"/>
  <circle cx="655" cy="315" r="5" fill="#0F9F8F" class="pulse"/>
  <circle cx="985" cy="315" r="5" fill="#0F9F8F" class="pulse2"/>

  <!-- delivery -->
  <rect x="580" y="438" width="650" height="48" rx="13" fill="#EAF3F7"/>
  <text x="602" y="468" class="mono" font-size="12" fill="#38566B">MAVEN → JUNIT / MOCKITO → DOCKER → GITHUB ACTIONS → AWS EC2 / RDS / SES</text>
</g>

