  <!-- security -->
  <rect x="930" y="153" width="150" height="106" rx="14" fill="#F0F9F7" stroke="#78BCAF"/>
  <text x="951" y="180" class="sans" font-size="14" font-weight="700" fill="#15324B">Spring Security</text>
  <text x="950" y="202" class="mono" font-size="11" fill="#637A89">JWT / OAuth2</text>
  <text x="950" y="220" class="mono" font-size="11" fill="#637A89">RBAC / BCrypt</text>
  <text x="950" y="238" class="mono" font-size="11" fill="#637A89">validation</text>

  <!-- services -->
  <rect x="1122" y="142" width="130" height="128" rx="14" fill="#EDF4FF" stroke="#8CB1E1"/>
  <text x="1144" y="170" class="sans" font-size="14" font-weight="700" fill="#15324B">Spring Boot</text>
  <text x="1140" y="194" class="mono" font-size="10.5" fill="#637A89">domain services</text>
  <text x="1140" y="214" class="mono" font-size="10.5" fill="#637A89">JPA / Hibernate</text>
  <text x="1140" y="234" class="mono" font-size="10.5" fill="#637A89">REST / gRPC</text>

  <path d="M698 206H748M880 206H930M1080 206H1122" stroke="#155EEF" stroke-width="3"/>
  <circle cx="720" cy="206" r="5" fill="#155EEF" class="pulse"/>
  <circle cx="905" cy="206" r="5" fill="#155EEF" class="pulse2"/>

  <!-- event + data plane -->
  <text x="582" y="307" class="mono" font-size="12" letter-spacing="2" fill="#527187">EVENT & DATA PLANE</text>

  <rect x="580" y="330" width="150" height="70" rx="13" fill="#FFF7F1" stroke="#E4B286"/>
  <text x="611" y="357" class="sans" font-size="14" font-weight="700" fill="#15324B">Apache Kafka</text>
  <text x="604" y="380" class="mono" font-size="11" fill="#637A89">async workflows</text>

  <rect x="760" y="330" width="124" height="70" rx="13" fill="#FFF3F0" stroke="#E4A398"/>
  <text x="796" y="357" class="sans" font-size="14" font-weight="700" fill="#15324B">Redis</text>
  <text x="779" y="380" class="mono" font-size="11" fill="#637A89">cache / session</text>

  <rect x="914" y="330" width="142" height="70" rx="13" fill="#F2F6FF" stroke="#90AFE0"/>
  <text x="940" y="357" class="sans" font-size="14" font-weight="700" fill="#15324B">PostgreSQL</text>
  <text x="943" y="380" class="mono" font-size="11" fill="#637A89">primary data</text>

  <rect x="1086" y="330" width="144" height="70" rx="13" fill="#F6F3FF" stroke="#AD9BDC"/>
