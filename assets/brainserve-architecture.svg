<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="28" fill="#0B1220"/>
  <defs>
    <linearGradient id="hero" x1="130" y1="70" x2="1470" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142238"/>
      <stop offset="1" stop-color="#0D1727"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="36" y="36" width="1528" height="828" rx="24" fill="url(#hero)" stroke="#253653"/>
  <text x="88" y="102" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">BrainServe Connect · System Architecture</text>
  <text x="88" y="139" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="18">Visitor & workforce operations · backend-enforced security · durable state · asynchronous delivery</text>

  <!-- user -->
  <circle cx="800" cy="205" r="46" fill="#162A46" stroke="#60A5FA" stroke-width="2"/>
  <text x="800" y="201" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="600">Visitor</text>
  <text x="800" y="222" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">or staff</text>

  <!-- frontend -->
  <g filter="url(#shadow)">
    <rect x="626" y="290" width="348" height="122" rx="18" fill="#111E31" stroke="#3B82F6"/>
    <text x="650" y="322" fill="#93C5FD" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">USER INTERFACE</text>
    <text x="650" y="353" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="600">React / TypeScript workspace</text>
    <text x="650" y="382" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="15">Typed API client · role-specific screens</text>
  </g>

  <!-- security -->
  <g filter="url(#shadow)">
    <rect x="638" y="474" width="324" height="112" rx="18" fill="#2A2111" stroke="#F59E0B"/>
    <text x="662" y="507" fill="#FCD34D" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">SECURITY GATE</text>
    <text x="662" y="539" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="19" font-weight="600">Spring Security + JWT</text>
    <text x="662" y="565" fill="#C7B98C" font-family="Inter,Segoe UI,Arial" font-size="14">role · scope · active-account checks</text>
  </g>

  <!-- modules -->
  <g filter="url(#shadow)">
    <rect x="90" y="474" width="392" height="178" rx="18" fill="#20151C" stroke="#FB7185"/>
    <text x="116" y="508" fill="#FDA4AF" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">WORKPLACE OPERATIONS</text>
    <text x="116" y="543" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="600">Tasks · insights · reports</text>
    <text x="116" y="575" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">department work · dashboards</text>
    <text x="116" y="600" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">scoped history · governance</text>
    <text x="116" y="625" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">employee administration</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1118" y="474" width="392" height="178" rx="18" fill="#11231B" stroke="#34D399"/>
    <text x="1144" y="508" fill="#6EE7B7" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">VISITOR OPERATIONS</text>
    <text x="1144" y="543" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="600">Appointments · lifecycle</text>
    <text x="1144" y="575" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">booking and reception coordination</text>
    <text x="1144" y="600" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">documents · QR access</text>
    <text x="1144" y="625" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="14">check-in / check-out history</text>
  </g>

  <!-- platform -->
  <g filter="url(#shadow)">
    <rect x="310" y="720" width="980" height="104" rx="18" fill="#101A2B" stroke="#64748B"/>
    <text x="336" y="751" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">PLATFORM SERVICES</text>

    <rect x="338" y="770" width="112" height="34" rx="9" fill="#172554" stroke="#60A5FA"/>
    <text x="394" y="792" text-anchor="middle" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial" font-size="13">PostgreSQL</text>

    <rect x="464" y="770" width="84" height="34" rx="9" fill="#3A1717" stroke="#F87171"/>
    <text x="506" y="792" text-anchor="middle" fill="#FEE2E2" font-family="Inter,Segoe UI,Arial" font-size="13">Redis</text>

    <rect x="562" y="770" width="86" height="34" rx="9" fill="#1E293B" stroke="#CBD5E1"/>
    <text x="605" y="792" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="13">ClamAV</text>

    <rect x="662" y="770" width="84" height="34" rx="9" fill="#191919" stroke="#E2E8F0"/>
    <text x="704" y="792" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="13">Kafka</text>

    <rect x="760" y="770" width="96" height="34" rx="9" fill="#182339" stroke="#60A5FA"/>
    <text x="808" y="792" text-anchor="middle" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial" font-size="13">SMTP</text>

    <rect x="870" y="770" width="120" height="34" rx="9" fill="#172554" stroke="#818CF8"/>
    <text x="930" y="792" text-anchor="middle" fill="#E0E7FF" font-family="Inter,Segoe UI,Arial" font-size="13">Audit records</text>

    <rect x="1004" y="770" width="136" height="34" rx="9" fill="#172554" stroke="#818CF8"/>
    <text x="1072" y="792" text-anchor="middle" fill="#E0E7FF" font-family="Inter,Segoe UI,Arial" font-size="13">Object storage</text>

    <rect x="1154" y="770" width="108" height="34" rx="9" fill="#11231B" stroke="#34D399"/>
    <text x="1208" y="792" text-anchor="middle" fill="#D1FAE5" font-family="Inter,Segoe UI,Arial" font-size="13">Notifications</text>
  </g>

  <!-- connectors -->
  <g stroke="#64748B" stroke-width="2" fill="none">
    <path d="M800 251V290"/>
    <path d="M800 412V474"/>
    <path d="M638 530H482"/>
    <path d="M962 530H1118"/>
    <path d="M286 652V686H800"/>
    <path d="M1314 652V686H800"/>
    <path d="M800 586V720"/>
  </g>

  <g fill="#64748B">
    <path d="M794 284L800 290L806 284"/>
    <path d="M794 468L800 474L806 468"/>
    <path d="M488 524L482 530L488 536"/>
    <path d="M1112 524L1118 530L1112 536"/>
    <path d="M794 714L800 720L806 714"/>
  </g>

  <text x="820" y="271" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">uses workspace</text>
  <text x="820" y="453" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">HTTPS REST API</text>
  <text x="500" y="516" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">authorized request</text>
  <text x="976" y="516" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">authorized request</text>
  <text x="820" y="690" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">durable data · cache · messaging · files · audit</text>
</svg>